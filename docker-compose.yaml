version: '3.8'

# ============================================================
# MongoDB + Redis برای توسعه‌ی محلی
#
#   pnpm docker:up     →  mongo:7 روی پورت 27017 و redis:7 روی 6379
#   pnpm db:seed       →  ساخت داده‌ی نمونه
#
# نکته: mongo با --replSet rs0 بالا می‌آید (replica set تک‌گرهی).
# دلیلش این است که MongoDB فقط روی replica set از «تراکنش چند
# داکیومنتی» پشتیبانی می‌کند و فاکتور/انبار/دفتر کل باید اتمیک باشند.
# healthcheck هم به‌صورت خودکار rs.initiate() را اجرا می‌کند.
# ============================================================

services:
  mongo:
    image: mongo:7
    container_name: mystore_mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ابزار گرافیکی مدیریت MongoDB (اختیاری) — http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    container_name: mystore_mongo_express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH: 'false'
    ports:
      - '8081:8081'

  redis:
    image: redis:7-alpine
    container_name: mystore_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
